# Databricks Apps manifest for multi-tenant-genie.
#
# Resources (Lakebase database, SQL warehouse, Genie space, AES key
# secret) are bound via the Apps UI after `databricks apps create`.
# The `valueFrom: <resource-name>` lookups here resolve once those
# bindings exist; until then the env vars are unset and the proxy
# falls back to local-dev paths (which fail closed in production).
#
# See docs/deploy.md for the full deploy walkthrough.

command:
  - "uvicorn"
  - "server.app:app"
  - "--host"
  - "0.0.0.0"
  - "--port"
  - "8000"

env:
  # Lakebase resource bound via `databricks apps update` populates
  # PGHOST/PGPORT/PGDATABASE/PGUSER/PGSSLMODE/PGAPPNAME automatically —
  # do NOT enumerate them here (explicit `valueFrom` collapses them to
  # the same value). The proxy mints an OAuth token at connect time as
  # the Postgres password.

  # AES-GCM key for SP credential encryption-at-rest.
  # Bind a Secret resource named "aes_key" pointing at scope
  # multi-tenant-genie / key aes_key_base64.
  - name: AES_KEY_BASE64
    valueFrom: aes_key

  # Workspace-scoped values. These are intentionally blank in the repo so
  # nothing workspace-specific ships. `scripts/deploy.sh` fills them in from
  # your deploy inputs (CATALOG, GENIE_SPACE_ID, WAREHOUSE host, etc.) right
  # before syncing. To deploy by hand instead, set them here.
  - name: MT_GENIE_HOST
    value: ""
  - name: MT_GENIE_CATALOG
    value: ""
  - name: MT_GENIE_SCHEMA
    value: "mt_genie_demo"
  - name: MT_GENIE_SPACE_ID
    value: ""
  # Published AI/BI dashboard (embed_credentials=false) for external embedding.
  # Generate one with scripts/publish_dashboard.py, then set its id here.
  - name: MT_GENIE_DASHBOARD_ID
    value: ""
  - name: MT_GENIE_ADMIN_GROUP
    value: "admins"
  - name: DOMAIN
    value: "travel"
